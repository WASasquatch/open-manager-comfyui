name: Vast.ai image

on:
  workflow_dispatch:
    inputs:
      comfyui:
        description: "ComfyUI release in vastai/comfy, such as v0.44.0. Empty for the newest"
        required: false
        default: ""
      rebuild:
        description: "Build even when this ComfyUI and Open Manager pair is already published"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: vastai-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wasasquatch/open-manager-vastai

jobs:
  manager:
    name: Open Manager release
    runs-on: ubuntu-latest
    if: >-
      github.repository_owner == 'WASasquatch'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the published commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Which Open Manager
        id: release
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "workflow_run" ]]; then
            manager="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
            for try in $(seq 1 30); do
              curl -fsS -o /dev/null "https://pypi.org/pypi/comfyui-open-manager/${manager}/json" \
                && curl -fsSL -H "Accept: application/vnd.pypi.simple.v1+json" "https://pypi.org/simple/comfyui-open-manager/" \
                  | jq -e --arg v "${manager}" '.versions | index($v)' > /dev/null \
                && break
              [[ "${try}" -lt 30 ]] || { echo "::error::PyPI does not list Open Manager ${manager}"; exit 1; }
              sleep 20
            done
          else
            manager="$(curl -fsSL https://pypi.org/pypi/comfyui-open-manager/json | jq -r .info.version)"
          fi
          [[ "${manager}" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::unexpected Open Manager version: ${manager}"; exit 1; }
          echo "version=${manager}" >> "$GITHUB_OUTPUT"
          echo "Open Manager ${manager}"

  image:
    name: Image for CUDA ${{ matrix.cuda }}
    needs: manager
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.9", "13.2"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Which ComfyUI
        id: versions
        env:
          CUDA: ${{ matrix.cuda }}
          COMFYUI: ${{ inputs.comfyui }}
          MANAGER: ${{ needs.manager.outputs.version }}
        run: |
          set -euo pipefail
          suffix="-cuda-${CUDA}-py312"
          if [[ -n "${COMFYUI}" ]]; then
            [[ "${COMFYUI}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a ComfyUI release: ${COMFYUI}"; exit 1; }
            base="${COMFYUI}${suffix}"
          else
            base="$(curl -fsSL "https://hub.docker.com/v2/repositories/vastai/comfy/tags?page_size=100&ordering=last_updated" \
              | jq -r '.results[].name' | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+${suffix}$" | sort -V | tail -n 1)"
          fi
          curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/vastai/comfy/tags/${base}"
          {
            echo "base=vastai/comfy:${base}"
            echo "comfyui=${base}"
            echo "pinned=${base}-om${MANAGER}"
          } >> "$GITHUB_OUTPUT"
          echo "vastai/comfy:${base} with Open Manager ${MANAGER}"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Already published?
        id: published
        env:
          PINNED: ${{ steps.versions.outputs.pinned }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          if [[ "${REBUILD}" != "true" ]] && docker manifest inspect "${IMAGE}:${PINNED}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${PINNED} is already published"
          fi

      - name: Free disk space
        if: steps.published.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup "${AGENT_TOOLSDIRECTORY}"
          docker system prune -af
          df -h /

      - name: Set up Docker Buildx
        if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: vastai
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.versions.outputs.base }}
            OPEN_MANAGER_VERSION=${{ needs.manager.outputs.version }}
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.versions.outputs.pinned }}
            ${{ env.IMAGE }}:${{ steps.versions.outputs.comfyui }}
            ${{ env.IMAGE }}:latest-cuda-${{ matrix.cuda }}
            ${{ matrix.cuda == '12.9' && format('{0}:latest', env.IMAGE) || '' }}
