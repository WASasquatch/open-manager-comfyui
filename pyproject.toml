[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-open-manager"
description = "A manager for the whole ComfyUI workspace: custom nodes, themes, models, downloads, a resource monitor and a desktop."
version = "0.4.1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jordan Thompson (WASasquatch)" }]
keywords = [
    "comfyui",
    "comfyui-manager",
    "custom-nodes",
    "package-manager",
    "stable-diffusion",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "aiohttp",
    "packaging",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
monitor = ["psutil", "pynvml"]

[project.urls]
Homepage = "https://github.com/WASasquatch/open-manager-comfyui"
Repository = "https://github.com/WASasquatch/open-manager-comfyui"
Issues = "https://github.com/WASasquatch/open-manager-comfyui/issues"

[tool.setuptools]
packages = ["open_manager", "comfyui_manager"]

[tool.setuptools.data-files]
comfyui_manager = ["comfyui_manager/__init__.py"]

[tool.setuptools.package-data]
open_manager = [
    "web/*.js",
    "web/*.svg",
    "web/modules/*.mjs",
    "web/programs/*/manifest.json",
    "web/programs/*/*.mjs",
    "web/programs/*/*.html",
    "web/programs/*/*.svg",
    "web/programs/*/*.png",
    "themes/*.json",
    "wallpapers/*.webp",
    "wallpapers/CREDITS.md",
]

[tool.comfy]
PublisherId = "was"
DisplayName = "Open Manager"
Icon = "https://raw.githubusercontent.com/WASasquatch/open-manager-comfyui/main/open-manager-comfyui.svg"
Banner = "https://raw.githubusercontent.com/WASasquatch/open-manager-comfyui/main/open-manager-banner.png"
